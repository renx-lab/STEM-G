<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM12G | Classmate Vault & Map</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="database.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --vintage-cream: #f4eee0;
            --vintage-sepia: #704214;
            --dark-wood: #1a120b;
            --paper-white: #faf9f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark-wood);
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            font-family: 'Special Elite', serif;
            color: var(--vintage-cream);
            min-height: 100vh;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed; inset: 0; background: var(--dark-wood); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        .loading-logo { width: 100px; filter: brightness(2); animation: pulse 2s infinite; }

        /* Navigation & Search */
        .vault-nav {
            position: sticky; top: 0; background: rgba(26, 18, 11, 0.95);
            padding: 15px 20px; z-index: 1000; border-bottom: 2px solid var(--vintage-sepia);
        }
        .nav-content { 
            max-width: 1200px; margin: 0 auto; 
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .search-container { position: relative; flex-grow: 1; max-width: 400px; }
        .search-box {
            width: 100%; padding: 12px; border: none; font-family: 'Special Elite';
            background: var(--paper-white); outline: none; border-radius: 4px;
        }
        .search-results {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: white; color: black; border-radius: 0 0 4px 4px;
            max-height: 250px; overflow-y: auto; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .search-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-item:hover { background: #f0f0f0; color: var(--vintage-sepia); }

        /* Map Styling */
        #schoolMap {
            height: 350px; width: 100%; max-width: 1000px; margin: 20px auto;
            border: 8px solid var(--paper-white); border-bottom-width: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 5;
        }

        /* Polaroid Grid */
        .memory-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px; padding: 40px 20px; max-width: 1200px; margin: 0 auto;
        }
        .member-card {
            background: var(--paper-white); padding: 15px 15px 35px 15px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3); transform: rotate(-1deg);
            transition: 0.3s; color: #333; cursor: pointer;
        }
        .member-card:hover { transform: rotate(0deg) scale(1.03); z-index: 10; }
        .photo-frame { 
            width: 100%; height: 250px; background: #ddd; 
            overflow: hidden; border: 1px solid #999; 
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-tag { margin-top: 15px; font-size: 1.2rem; border-bottom: 1px dashed #ccc; }
        .note-text { font-family: 'Caveat', cursive; font-size: 1.4rem; margin-top: 10px; line-height: 1.2; }

        /* Modals */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { 
            background: var(--paper-white); padding: 25px; width: 100%; max-width: 400px; 
            color: #222; position: relative;
        }
        .modal-content input, .modal-content textarea {
            width: 100%; margin: 10px 0; padding: 10px; font-family: 'Special Elite';
        }

        .vintage-btn {
            background: var(--vintage-sepia); color: white; border: none;
            padding: 10px 20px; cursor: pointer; font-family: 'Special Elite';
        }

        @media (max-width: 600px) {
            .nav-content { flex-direction: column; }
            #schoolMap { height: 250px; }
        }
    </style>
</head>
<body>

    <div id="loadingLayer" class="loading-screen">
        <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" class="loading-logo">
        <p style="margin-top: 20px;">ACCESSING STEM-12G VAULT...</p>
    </div>

    <header class="vault-nav">
        <div class="nav-content">
            <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" width="50" style="filter: sepia(1);">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-box" placeholder="Search Classmate Name...">
                <div id="searchResults" class="search-results"></div>
            </div>
            <button onclick="openModal('uploadModal')" class="vintage-btn">+ NEW</button>
        </div>
    </header>

    <h1 style="text-align: center; margin-top: 30px; font-size: 2.5rem;">OUR HOME</h1>
    <div id="schoolMap"></div>

    <div class="memory-grid" id="memoryGrid"></div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="editTitle">Update Info</h3>
            <form id="editForm">
                <input type="hidden" id="editId">
                <textarea id="editNote" rows="4" placeholder="Update your note here..."></textarea>
                <label style="font-size: 0.7rem;">Change Photo (Optional):</label>
                <input type="file" id="editFile" accept="image/*">
                <button type="submit" id="editSubmitBtn" class="vintage-btn" style="width: 100%;">SAVE RECORD</button>
                <button type="button" onclick="closeModal('editModal')" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Cancel</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // --- LOGIC ---
        let allClassmates = [];
        const sccCoords = [7.8251, 123.4355]; // Saint Columban College, Sagun St.

        // Initialize Map
        const map = L.map('schoolMap').setView(sccCoords, 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker(sccCoords).addTo(map).bindPopup("<b>Saint Columban College</b><br>Sagun St, Pagadian City").openPopup();

        // 1. Fetch Classmates
        async function loadData() {
            try {
                const { data, error } = await supabase.from('classmates').select('*').order('name', { ascending: true });
                if (error) throw error;
                allClassmates = data;
                renderCards(allClassmates);
            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loadingLayer').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingLayer').style.display = 'none', 1000);
            }
        }

        // 2. Render Grid
        function renderCards(list) {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            list.forEach(person => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.onclick = () => openEditModal(person);
                card.innerHTML = `
                    <div class="photo-frame">
                        ${person.image_url ? `<img src="${person.image_url}">` : `<div style="padding:50px; text-align:center; color:#999;">No Photo</div>`}
                    </div>
                    <div class="name-tag">${person.name}</div>
                    <div class="note-text">"${person.note || 'No note yet...'}"</div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Fuzzy Search Logic
        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            resultsDiv.innerHTML = '';
            
            if (term.length > 0) {
                const matches = allClassmates.filter(p => p.name.toLowerCase().includes(term));
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerText = m.name;
                    item.onclick = () => {
                        openEditModal(m);
                        resultsDiv.style.display = 'none';
                        searchInput.value = '';
                    };
                    resultsDiv.appendChild(item);
                });
                resultsDiv.style.display = matches.length ? 'block' : 'none';
            } else {
                resultsDiv.style.display = 'none';
            }
        });

        // 4. Edit Modal Logic
        function openEditModal(person) {
            document.getElementById('editId').value = person.id;
            document.getElementById('editTitle').innerText = `Editing: ${person.name}`;
            document.getElementById('editNote').value = person.note || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('editSubmitBtn');
            btn.innerText = "UPDATING...";
            btn.disabled = true;

            const id = document.getElementById('editId').value;
            const note = document.getElementById('editNote').value;
            const file = document.getElementById('editFile').files[0];

            try {
                let imgUrl = null;
                if (file) {
                    const fName = `update_${id}_${Date.now()}`;
                    await supabase.storage.from('photos').upload(fName, file);
                    const { data } = supabase.storage.from('photos').getPublicUrl(fName);
                    imgUrl = data.publicUrl;
                }

                const upData = { note: note };
                if (imgUrl) upData.image_url = imgUrl;

                const { error } = await supabase.from('classmates').update(upData).eq('id', id);
                if (error) throw error;

                location.reload();
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = "SAVE RECORD";
            }
        };

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Start
        window.onload = loadData;
    </script>
</body>
</html>
