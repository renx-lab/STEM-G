<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM12G | Private Vault</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --vintage-cream: #f4eee0;
            --vintage-sepia: #704214;
            --dark-wood: #1a120b;
            --error-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark-wood) url('https://www.transparenttextures.com/patterns/dark-wood.png');
            font-family: 'Special Elite', serif;
            color: var(--vintage-cream);
            display: flex;
            min-height: 100vh;
        }

        /* Side Navigation Menu */
        .side-menu {
            width: 250px;
            background: rgba(0,0,0,0.8);
            border-right: 2px solid var(--vintage-sepia);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100%;
        }

        .menu-logo { width: 80px; margin: 0 auto 20px; filter: sepia(1); }

        .menu-link {
            padding: 15px;
            color: var(--vintage-cream);
            text-decoration: none;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-link:hover { background: var(--vintage-sepia); color: white; }

        /* Main Content Area */
        .main-container {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 40px;
        }

        /* Search Section */
        .search-wrapper {
            position: relative;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            font-family: 'Special Elite';
            font-size: 1.1rem;
            border-radius: 5px;
            border: none;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            width: 100%;
            background: white;
            color: black;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .search-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .search-item:hover { background: #f0f0f0; color: var(--vintage-sepia); }

        /* Error Message Box */
        #errorNotice {
            display: none;
            background: var(--error-red);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid white;
        }

        /* Classmate Grid */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .member-card {
            background: #fff;
            padding: 15px 15px 40px;
            color: #333;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            transform: rotate(-1deg);
            cursor: pointer;
        }

        .photo-frame {
            height: 200px;
            background: #e0e0e0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* Modals */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 5000; align-items: center; justify-content: center;
        }

        .modal-content { background: white; color: #222; padding: 30px; width: 400px; }

        @media (max-width: 768px) {
            .side-menu { width: 70px; padding: 10px; }
            .menu-link span { display: none; }
            .main-container { margin-left: 70px; width: calc(100% - 70px); }
        }
    </style>
</head>
<body>

    <nav class="side-menu">
        <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" class="menu-logo">
        <a class="menu-link" onclick="location.reload()"><span>🏠 Home</span></a>
        <a class="menu-link" onclick="openSearch()"><span>🔍 Search Classmate</span></a>
        <a class="menu-link" onclick="alert('Graduation Countdown: 120 Days')"><span>🎓 Events</span></a>
        <a class="menu-link" href="https://www.sccpag.edu.ph/" target="_blank"><span>🌐 SCC Site</span></a>
        <a class="menu-link" style="margin-top:auto; color:red;" href="index.html"><span>🚪 Logout</span></a>
    </nav>

    <main class="main-container">
        
        <div id="errorNotice">
            <strong>⚠️ CONNECTION ERROR:</strong> 
            <span id="errorMsg">The Vault cannot reach the database. Check your database.js and internet.</span>
        </div>

        <h1 style="margin-bottom: 20px;">STEM12-G VAULT</h1>

        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Type a name (ex: Renz, Shapayra...)">
            <div id="resultsBox" class="search-dropdown"></div>
        </div>

        <div class="class-grid" id="mainGrid">
            </div>
    </main>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2 id="targetName" style="margin-bottom: 10px;">Edit</h2>
            <form id="editForm">
                <input type="hidden" id="targetId">
                <textarea id="targetNote" rows="5" style="width: 100%; padding: 10px;" placeholder="Write a memory..."></textarea>
                <p style="font-size: 0.8rem; margin: 10px 0;">Upload Polaroid (Optional):</p>
                <input type="file" id="targetFile" accept="image/*" style="width: 100%;">
                <button type="submit" id="saveBtn" class="menu-link" style="width: 100%; margin-top: 20px; background: var(--vintage-sepia); border:none;">SEAL CHANGES</button>
                <button type="button" onclick="closeModal()" style="width: 100%; background: none; border: none; color: red; margin-top: 10px; cursor: pointer;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        let classmates = [];

        // 1. Start & Check Connection
        async function init() {
            if (typeof supabase === 'undefined') {
                showError("Supabase is NOT defined. Check if database.js is linked correctly.");
                return;
            }

            try {
                const { data, error } = await supabase.from('classmates').select('*').order('name', { ascending: true });
                if (error) throw error;
                
                classmates = data;
                render(classmates);
            } catch (err) {
                showError("Database Error: " + err.message);
            }
        }

        // 2. Render Cards
        function render(list) {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'member-card';
                div.onclick = () => openEdit(p);
                div.innerHTML = `
                    <div class="photo-frame">
                        ${p.image_url ? `<img src="${p.image_url}">` : `<span>No Photo</span>`}
                    </div>
                    <h3 style="margin-top:10px;">${p.name}</h3>
                    <p style="font-family:'Caveat'; font-size:1.2rem;">${p.note || 'No note yet...'}</p>
                `;
                grid.appendChild(div);
            });
        }

        // 3. Search Closeness Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            const res = document.getElementById('resultsBox');
            res.innerHTML = '';

            if (val.length > 0) {
                const matches = classmates.filter(p => p.name.toLowerCase().includes(val));
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<strong>${m.name}</strong>`;
                    item.onclick = () => openEdit(m);
                    res.appendChild(item);
                });
                res.style.display = matches.length ? 'block' : 'none';
            } else {
                res.style.display = 'none';
            }
        });

        // 4. Modal Functions
        function openEdit(p) {
            document.getElementById('targetId').value = p.id;
            document.getElementById('targetName').innerText = p.name;
            document.getElementById('targetNote').value = p.note || '';
            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('resultsBox').style.display = 'none';
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SAVING...";
            
            const id = document.getElementById('targetId').value;
            const note = document.getElementById('targetNote').value;
            const file = document.getElementById('targetFile').files[0];

            try {
                let url = null;
                if (file) {
                    const fName = `img_${id}_${Date.now()}`;
                    await supabase.storage.from('photos').upload(fName, file);
                    const { data } = supabase.storage.from('photos').getPublicUrl(fName);
                    url = data.publicUrl;
                }

                const upData = { note };
                if (url) upData.image_url = url;

                const { error } = await supabase.from('classmates').update(upData).eq('id', id);
                if (error) throw error;
                location.reload();
            } catch (err) {
                alert(err.message);
                btn.innerText = "SEAL CHANGES";
            }
        };

        function showError(msg) {
            document.getElementById('errorNotice').style.display = 'block';
            document.getElementById('errorMsg').innerText = msg;
        }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        function openSearch() { document.getElementById('searchInput').focus(); }

        init();
    </script>
</body>
</html>
