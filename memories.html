<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM12G | Memory Vault</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="database.js"></script>
</head>
<body class="gallery-view">

    <div class="grain"></div>

    <div id="loadingLayer" class="loading-screen">
        <div class="loading-content">
            <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" alt="SCC Logo" class="loading-logo">
            <h1 class="class-title" style="margin-top: 15px; color: #f4eee0;">STEM12G</h1>
            <p class="typewriter-text">Decrypting the Vault...</p>
        </div>
    </div>

    <header class="vault-nav">
        <div class="nav-content">
            <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" alt="SCC Logo" class="mini-logo">
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by Name or Date (YYYY-MM-DD)..." autocomplete="off">
            </div>

            <button id="openUploadBtn" class="vintage-btn">+ Add Memory</button>
        </div>
    </header>

    <main class="scrapbook-area">
        <div class="sorting-indicator">
            <p>Chronological Order: Earliest Uploads First</p>
        </div>

        <div class="memory-grid" id="memoryGrid">
            </div>
    </main>

    <div id="uploadModal" class="modal">
        <div class="polaroid-card modal-content">
            <div class="modal-header">
                <h3 class="name-tag" style="margin: 0;">New Memory Entry</h3>
                <span class="close-modal">&times;</span>
            </div>
            
            <form id="uploadForm" class="upload-form">
                <div class="input-group">
                    <input type="text" id="uploaderName" placeholder="Your Full Name" required>
                </div>

                <div class="input-group">
                    <label for="memoryDate" style="font-size: 0.7rem; color: #666; display: block; text-align: left;">Date of Memory:</label>
                    <input type="date" id="memoryDate" required>
                </div>

                <div class="input-group">
                    <textarea id="uploaderNote" placeholder="Write your memory or notes here..." required></textarea>
                </div>
                
                <div class="file-section">
                    <label class="custom-file-upload">
                        <input type="file" id="photoUpload" accept="image/*" required>
                        <span>Attach Photo Polaroid</span>
                    </label>
                </div>
                
                <button type="submit" id="submitBtn">Seal into Vault</button>
            </form>
        </div>
    </div>

    <footer>
        <p>STEM12G Memory Vault • Created by Renz Nollora</p>
    </footer>

    <script src="memories.js"></script>

</body>
</html>
