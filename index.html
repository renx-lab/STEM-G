<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM12G | The Vault</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="grain"></div>

    <main class="login-wrapper">
        <div class="polaroid-card">

            <div class="photo-area">
                <img src="https://www.sccpag.edu.ph/wp-content/uploads/2022/02/cropped-logo-1.png" alt="SCC Logo" class="school-logo">
                <div class="vignette"></div>
                <h1 class="class-title">STEM12G</h1>
                <p class="subtitle">Est. 2024 • Memory Vault</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-field">
                    <input type="text" id="username" placeholder="Class Username" required autocomplete="off">
                </div>
                <div class="input-field">
                    <input type="password" id="password" placeholder="The Secret Code" required>
                </div>

                <button type="submit" id="loginBtn">Enter the Vault</button>
            </form>

        </div>
    </main>

    <footer>
        <p>Created by Renz Nollora</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
